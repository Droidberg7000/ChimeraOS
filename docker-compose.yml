# ChimeraOS / AngieAI service stack
#
# angieai-onnx      -> local model inference lane (FastAPI + ONNX Runtime)
# angieai-reasoner   -> deterministic routing/reasoning lane
# angieai-pentest    -> authorized-use-only recon/diagnostics lane (cyberdeck
#                       mission) — see services/angieai-pentest/README.md
#
# These are optional local backends AngieAI can call instead of a remote
# OpenRouter model. Bring up with:
#   docker compose up --build
#
version: "3.9"

services:
  angieai-onnx:
    build: ./services/angieai-onnx
    container_name: angieai-onnx
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/model.onnx
    restart: unless-stopped
    networks:
      - angieai-net

  angieai-reasoner:
    build: ./services/angieai-reasoner
    container_name: angieai-reasoner
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - angieai-net

  angieai-pentest:
    build: ./services/angieai-pentest
    container_name: angieai-pentest
    ports:
      - "8002:8002"
    volumes:
      - ./services/angieai-pentest/logs:/app/logs
    restart: unless-stopped
    networks:
      - angieai-net

networks:
  angieai-net:
    driver: bridge
