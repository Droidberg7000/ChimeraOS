name: Deploy Web OS to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'web-os/**'
      - '.github/workflows/web-os-deploy.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: chimeraos-web-os
  IMAGE_NAME: chimeraos-web-os

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-os/package-lock.json

      - name: Install dependencies
        working-directory: web-os
        run: npm ci

      - name: Build frontend
        working-directory: web-os
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: web-os
          file: web-os/Dockerfile
          push: true
          tags: |
            gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest
            gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest
          env_vars: |
            NODE_ENV=production
            PORT=8080
          secrets: |
            TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest
            FIREBASE_API_KEY=FIREBASE_API_KEY:latest
            FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 10
          curl -f ${{ steps.get-url.outputs.service_url }}/health || exit 1

      - name: Deployment summary
        run: |
          echo "✅ Deployment complete!"
          echo "Service URL: ${{ steps.get-url.outputs.service_url }}"
          echo "Image: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest"
          echo "Commit: ${{ github.sha }}"
