<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>BB10 Bridge Console</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="screen">
        <div class="header">
            <img src="assets/icon-86.png" alt="AngieAI" />
            <h1>BRIDGE CONSOLE</h1>
            <span id="statusPill" class="status-pill offline">OFFLINE</span>
        </div>

        <form id="bridgeForm">
            <div class="field">
                <label for="host">Termux / AngieAI Host</label>
                <input type="text" id="host" placeholder="192.168.1.42" />
            </div>

            <div class="row">
                <div class="field">
                    <label for="reasonerPort">Reasoner Port</label>
                    <input type="number" id="reasonerPort" placeholder="8001" />
                </div>
                <div class="field">
                    <label for="onnxPort">ONNX Port</label>
                    <input type="number" id="onnxPort" placeholder="8000" />
                </div>
                <div class="field">
                    <label for="pentestPort">Pentest Port</label>
                    <input type="number" id="pentestPort" placeholder="8002" />
                </div>
            </div>

            <div class="field">
                <label for="userField">User (optional)</label>
                <input type="text" id="userField" placeholder="angieai" />
            </div>

            <div class="field">
                <label for="queryText">Query to AngieAI</label>
                <input type="text" id="queryText" placeholder="build me an apk for the Q20" />
            </div>

            <button type="button" id="connectBtn">Test Connection</button>
            <button type="button" id="sendBtn" class="secondary">Send to Reasoner</button>

            <div class="recon-panel">
                <div class="recon-title">RECON &middot; authorized use only</div>
                <label class="checkbox-row" for="authorizedCheck">
                    <input type="checkbox" id="authorizedCheck" />
                    I own or have explicit permission to test this network/device
                </label>

                <div class="field">
                    <label for="subnetField">Subnet Sweep (CIDR)</label>
                    <input type="text" id="subnetField" placeholder="192.168.1.0/24" />
                </div>
                <button type="button" id="sweepBtn" class="secondary">Sweep Subnet</button>

                <div class="row">
                    <div class="field">
                        <label for="targetHost">Target Host</label>
                        <input type="text" id="targetHost" placeholder="192.168.1.1" />
                    </div>
                    <div class="field">
                        <label for="targetPorts">Ports (csv)</label>
                        <input type="text" id="targetPorts" placeholder="22,80,443" />
                    </div>
                </div>
                <button type="button" id="portScanBtn" class="secondary">Scan Ports</button>
                <button type="button" id="fullRangeBtn" class="secondary">Use Full Range (1-65535)</button>
                <button type="button" id="analyzeBtn" class="secondary">Analyze Last Scan</button>
            </div>

            <div class="log" id="log">Bridge console idle. Enter your Termux host/ports and tap Test Connection.</div>
        </form>

        <div class="footer-note">AngieAI / ChimeraOS · BB10 Bridge Console · com.user.bb10bridgeconsole</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
